# ===== snack-check pipeline configuration =====
# Every script reads its parameters from this file; nothing is hard-coded.

data:
  # Raw data source (Open Food Facts on Hugging Face, ODbL license)
  hf_repo_id: "openfoodfacts/product-database"
  hf_filename: "food.parquet"
  sample_size: 100000          # number of rows to keep after cleaning
  seed: 42                     # random seed for sampling, for reproducibility
  local_dir: "data"            # local data folder (git-ignored)
  clean_filename: "food_clean.parquet"
  # Google Cloud Storage location
  gcs_bucket: "snack-check-data-lexie"
  gcs_blob: "data/food_clean.parquet"

target:
  source_column: nova_group    # NOVA processing level 1-4
  name: ultra_processed        # binary target: 1 = ultra-processed (NOVA 4)
  positive_value: 4

features:                      # per 100g; must match the API input fields
  - energy_kcal
  - fat
  - saturated_fat
  - carbohydrates
  - sugars
  - fiber
  - proteins
  - salt
  - additives_n

split:
  test_size: 0.15
  val_size: 0.15
  random_state: 42

model:
  type: random_forest          # logistic_regression | random_forest
  params:
    logistic_regression:
      C: 1.0
      max_iter: 1000
      class_weight: balanced
    random_forest:
      n_estimators: 200
      max_depth: 12
      min_samples_leaf: 5
      class_weight: balanced
      n_jobs: -1
      random_state: 42

mlflow:
  tracking_uri: "sqlite:///mlflow.db"   # local MLflow backend (git-ignored)
  experiment_name: "snack-check"

output:
  model_dir: "models"                   # local model folder (git-ignored)
  model_filename: "model.joblib"
  gcs_blob: "models/model.joblib"       # where the API loads the model from
